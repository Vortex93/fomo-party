name: Guest page
on:
    push:
        branches: [main]
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: pages
    cancel-in-progress: false
jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
            - run: node --test tests/*.test.mjs
            - uses: actions/configure-pages@v5
            - name: Prepare static guest assets
              run: |
                  mkdir -p dist
                  cp web/index.html web/styles.css web/app.js dist/
                  cp -R web/lib dist/lib
                  touch dist/.nojekyll
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist
            - uses: actions/deploy-pages@v4
              id: deployment
